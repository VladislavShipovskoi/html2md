<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extensionName">HTML to Markdown</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="32" height="32" alt="" />
      <h1 data-i18n="extensionName">HTML to Markdown</h1>
    </header>
    <main aria-live="polite" aria-busy="true">
      <p id="status" class="status" data-state="loading" data-i18n="checking"></p>
      <p id="message" data-i18n="checkingDescription"></p>
      <dl id="details" hidden>
        <dt data-i18n="pageLabel"></dt>
        <dd id="page-title"></dd>
        <dt data-i18n="textLabel"></dt>
        <dd id="text-count"></dd>
      </dl>
      <button id="convert" type="button" data-i18n="convert" hidden></button>
      <section id="output" hidden>
        <label for="preview" data-i18n="previewLabel"></label>
        <textarea id="preview" readonly spellcheck="false"></textarea>
        <div class="actions">
          <button id="copy" type="button" data-i18n="copy"></button>
          <button id="download" type="button" data-i18n="download"></button>
        </div>
      </section>
      <p id="action-message" role="status"></p>
    </main>
    <footer data-i18n="footer"></footer>
  </body>
</html>
