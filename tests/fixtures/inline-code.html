<article>
  <h1>Inline code in text and lists</h1>
  <p>
    Use <code>for...of</code> to iterate, <code>+</code> to add, and <code>x + y</code> as an
    expression.
  </p>
  <ul>
    <li><code>value</code> — значение узла</li>
    <li>
      <code>left</code> — левый потомок (или <code>None</code>/<code>null</code>/<code>nil</code>)
    </li>
    <li><code>right</code> — правый потомок</li>
  </ul>
  <p>Backticks inside inline code: <code>`name`</code>. Escaped HTML: <code>&lt;div&gt;</code>.</p>
</article>
