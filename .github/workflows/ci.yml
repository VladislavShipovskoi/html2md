name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    name: Collect commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.collect.outputs.shas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collect commit SHAs
        id: collect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi
            shas=$(git rev-list --reverse "$BEFORE..$AFTER")
          else
            shas="$GITHUB_SHA"
          fi

          if [[ -z "$shas" ]]; then
            shas="$GITHUB_SHA"
          fi

          json=$(printf '%s\n' "$shas" | jq -R . | jq -sc .)
          count=$(jq 'length' <<< "$json")
          if (( count > 128 )); then
            echo "::error::Push contains $count commits; the two-version test matrix supports at most 128."
            exit 1
          fi
          echo "shas=$json" >> "$GITHUB_OUTPUT"

  checks:
    needs: commits
    name: Checks (${{ matrix.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sha: ${{ fromJSON(needs.commits.outputs.shas) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  tests:
    needs: commits
    name: Tests (${{ matrix.sha }}, Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sha: ${{ fromJSON(needs.commits.outputs.shas) }}
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build test fixtures
        run: npm run build
      - name: Test
        run: npm test
